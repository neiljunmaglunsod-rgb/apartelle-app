<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>J&J Apartelle - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: #1e1e1e; border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); text-align: center; }
    .logo { width: 100px; margin-bottom: 16px; border-radius: 12px; }
    h2 { color: #c9a84c; font-size: 22px; margin-bottom: 4px; }
    p { color: #888; font-size: 13px; margin-bottom: 32px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { color: #aaa; font-size: 13px; display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 16px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: border 0.2s; }
    input:focus { border-color: #c9a84c; }
    button { width: 100%; padding: 13px; background: #c9a84c; color: #1a1a1a; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    button:hover { background: #e0bb5f; }
    .error { color: #e74c3c; font-size: 13px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="/images/jj-logo.png" alt="J&J Logo" class="logo"/>
    <h2>J&J Apartelle</h2>
    <p>Management System — Please log in</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"/>
    </div>
    <button onclick="login()">Log In</button>
    <div class="error" id="error-msg">Invalid username or password</div>
  </div>
  <script>
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      errorMsg.style.display = 'none';
      if (!username || !password) {
        errorMsg.textContent = 'Please enter username and password';
        errorMsg.style.display = 'block';
        return;
      }
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard.html';
        } else {
          errorMsg.textContent = data.error || 'Invalid username or password';
          errorMsg.style.display = 'block';
        }
      } catch {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.style.display = 'block';
      }
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
